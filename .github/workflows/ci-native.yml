name: CI Native

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask==2.3.3 Werkzeug==2.3.7 Jinja2==3.1.2 Flask-SQLAlchemy==3.0.5 SQLAlchemy==2.0.23 Flask-Migrate==4.0.5 Flask-Babel==3.1.0

      - name: Initialize SQLite database
        run: |
          python - <<'EOF'
          import sqlite3, os
          db_path = os.environ.get("DB_PATH", "app.db")
          conn = sqlite3.connect(db_path)
          conn.execute("""
              CREATE TABLE IF NOT EXISTS tasks (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  content TEXT NOT NULL,
                  completed INTEGER DEFAULT 0
              )
          """)
          conn.commit()
          conn.close()
          print(f"Database initialized at {db_path}")
          EOF

      - name: Smoke test Flask server
        run: |
          cat << 'EOF' > run_server.py
          import sys
          import os
          
          base_dir = os.getcwd()
          sys.path.insert(0, base_dir)
          sys.path.insert(0, os.path.join(base_dir, 'application'))
          sys.path.insert(0, os.path.join(base_dir, 'application', 'controllers'))
          sys.path.insert(0, os.path.join(base_dir, 'application', 'models'))
          sys.path.insert(0, os.path.join(base_dir, 'application', 'configs'))
          
          from app import create_app
          
          app = create_app()
          if __name__ == '__main__':
              app.run(host='127.0.0.1', port=5000)
          EOF

          nohup python run_server.py > flask.log 2>&1 &
          FLASK_PID=$!
          echo "Flask started with PID $FLASK_PID"

          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/ | grep -q "200"; then
              echo "Server is up (attempt $i)"
              break
            fi
            echo "Waiting for server... attempt $i"
            sleep 1
          done

          echo "--- flask.log ---"
          cat flask.log

          echo "--- curl output ---"
          curl -f -s -o /dev/null -w "HTTP status: %{http_code}\n" http://127.0.0.1:5000/

          kill $FLASK_PID || true